# Fork-only: a tag oac-* builds the Linux amd64 Go FFI the same way release-linux.yml does
# and attaches it, with its sha256, to a release of that tag.
name: OAC Go FFI

on:
  push:
    tags: ["oac-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_INCREMENTAL: "0"
  FFI_ASSET: libmicrosandbox_go_ffi-linux-amd64.so

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install build dependencies
        run: dnf install -y libcap-ng-devel

      - name: Build and validate Go FFI
        run: |
          cargo build --release -p microsandbox-go
          python3 scripts/ci/validate_linux_glibc.py --max-version 2.28 target/release/libmicrosandbox_go_ffi.so
          mkdir dist
          cp target/release/libmicrosandbox_go_ffi.so "dist/$FFI_ASSET"
          (cd dist && sha256sum "$FFI_ASSET" > "$FFI_ASSET.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-ffi
          path: dist/
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-ffi
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Go FFI built from $GITHUB_SHA."
